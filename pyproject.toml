[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | migrations
  | __pycache__
  | htmlcov
)/
'''
